# Alembic configuration file

[alembic]
# Path to migration scripts (relative to where alembic is run)
# Run from project root: alembic -c server/alembic.ini upgrade head
script_location = server/migrations

# Template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s

# Timezone for migration file timestamps
timezone = UTC

# Truncate revision hashes
truncate_slug_length = 40

# Set to 'true' to run environment during revision creation
revision_environment = false

# Set to 'true' to allow .pyc and .pyo files
sourceless = false

# Version table name
version_table = alembic_version

# Version table schema
version_table_schema = public

# Output encoding for migration files
output_encoding = utf-8

# Database URL - will be overridden by env.py
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# Format migration files with black
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
